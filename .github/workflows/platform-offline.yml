name: platform-offline

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: platform-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-derived-kubernetes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Source-derived Helm and Kustomize validation
        run: bash scripts/run_heavy_validation.sh kubernetes

  platform-state:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install offline-validation dependencies
        run: python -m pip install "pytest>=8,<9" "PyYAML>=6,<7"
      - name: Verify repository-wide source manifest
        run: python scripts/check_infrastructure_manifest.py
      - name: Verify platform authority boundary
        run: python scripts/check_platform_authority.py
      - name: Validate retained platform structures
        run: python scripts/validate_surfaces.py
      - name: Run retained platform tests
        run: python -m pytest -q tests/test_deployment_surfaces.py tests/test_backend_contract.py
