name: required

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Terraform format
        run: terraform fmt -check -recursive

      - name: Initialize without backend using committed lock
        run: >-
          terraform -chdir=terraform/environments/gke-autopilot init
          -backend=false -input=false -lockfile=readonly

      - name: Validate desired state
        run: terraform -chdir=terraform/environments/gke-autopilot validate

      - name: Mocked Terraform tests
        run: terraform -chdir=terraform/environments/gke-autopilot test -no-color

      - name: Authority and publication policy
        run: python scripts/check_policy.py

      - name: Repository tests
        run: python -m unittest discover -s tests -v
