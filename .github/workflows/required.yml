name: required

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Terraform format
        run: terraform fmt -check -recursive
      - name: Initialize GKE example offline
        run: terraform -chdir=terraform/environments/gke-autopilot init -backend=false -input=false -lockfile=readonly
      - name: Validate and test GKE example
        run: |
          terraform -chdir=terraform/environments/gke-autopilot validate
          terraform -chdir=terraform/environments/gke-autopilot test -no-color
      - name: Initialize Cloud Run example offline
        run: terraform -chdir=terraform/environments/cloud-run-service-example init -backend=false -input=false -lockfile=readonly
      - name: Validate and test Cloud Run example
        run: |
          terraform -chdir=terraform/environments/cloud-run-service-example validate
          terraform -chdir=terraform/environments/cloud-run-service-example test -no-color
      - name: Initialize global-address example offline
        run: terraform -chdir=terraform/environments/gke-exposure-address init -backend=false -input=false -lockfile=readonly
      - name: Validate and test global-address example
        run: |
          terraform -chdir=terraform/environments/gke-exposure-address validate
          terraform -chdir=terraform/environments/gke-exposure-address test -no-color
      - name: Initialize GitHub WIF provisioning offline
        run: terraform -chdir=terraform/environments/github-ops-wif init -backend=false -input=false -lockfile=readonly
      - name: Validate GitHub WIF provisioning
        run: terraform -chdir=terraform/environments/github-ops-wif validate
      - name: Test GitHub WIF provisioning
        run: terraform -chdir=terraform/environments/github-ops-wif test -no-color
      - name: Initialize private Cloud Run workflow example offline
        run: terraform -chdir=terraform/environments/private-cloud-run-workflow-example init -backend=false -input=false -lockfile=readonly
      - name: Validate and test private Cloud Run workflow example
        run: |
          terraform -chdir=terraform/environments/private-cloud-run-workflow-example validate
          terraform -chdir=terraform/environments/private-cloud-run-workflow-example test -no-color
      - name: Initialize Cloud Run module credential-free
        run: terraform -chdir=terraform/modules/cloud-run-service init -backend=false -input=false
      - name: Validate and test Cloud Run module
        run: |
          terraform -chdir=terraform/modules/cloud-run-service validate
          terraform -chdir=terraform/modules/cloud-run-service test -no-color
      - name: Initialize private Cloud Run workflow module credential-free
        run: terraform -chdir=terraform/modules/private-cloud-run-workflow init -backend=false -input=false
      - name: Validate and test private Cloud Run workflow module
        run: |
          terraform -chdir=terraform/modules/private-cloud-run-workflow validate
          terraform -chdir=terraform/modules/private-cloud-run-workflow test -no-color
      - name: Pinned Terraform completion audit
        run: python scripts/check_terraform_completion.py
      - name: Authority and publication policy
        run: python scripts/check_policy.py
      - name: Repository tests
        run: python -m unittest discover -s tests -v
